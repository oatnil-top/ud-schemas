# Schedule two hours on a task. Without an offset the times are read in the
# timezone of the machine running `ud apply`; write RFC3339 to pin the instant.
apiVersion: ud/v1
kind: TimeBlock
spec:
  task: ecff3bb8
  start: 2026-10-27T14:00
  end: 2026-10-27T16:00
---
# Move an existing block (metadata.id) to the next morning, same task.
# Only what changes needs to be written.
apiVersion: ud/v1
kind: TimeBlock
metadata:
  id: 3f2a9c1e-0000-4000-8000-000000000000
spec:
  start: 2026-10-28T09:00:00+08:00
  end: 2026-10-28T11:00:00+08:00
